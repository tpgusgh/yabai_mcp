<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>야바이 썸네일</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; }
  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 24% 52%, rgba(255, 59, 48, .55) 0%, rgba(255, 59, 48, .12) 34%, transparent 58%),
      linear-gradient(135deg, #14101f 0%, #0b0d17 60%, #1a0d14 100%);
    overflow: hidden;
    position: relative;
  }
  /* 경보 파동 */
  .ring { position: absolute; left: 310px; top: 372px; border: 3px solid rgba(255, 82, 70, .5); border-radius: 50%; transform: translate(-50%, -50%); }
  .r1 { width: 300px; height: 300px; }
  .r2 { width: 460px; height: 460px; border-color: rgba(255, 82, 70, .3); }
  .r3 { width: 640px; height: 640px; border-color: rgba(255, 82, 70, .16); }
  .r4 { width: 860px; height: 860px; border-color: rgba(255, 82, 70, .08); }

  svg.siren { position: absolute; left: 160px; top: 218px; width: 300px; height: 300px; }

  .copy { position: absolute; left: 560px; top: 78px; width: 660px; }
  .kicker { display: inline-block; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #ff5a4f; background: rgba(255, 90, 79, .14); border: 1px solid rgba(255, 90, 79, .5); padding: 8px 18px; border-radius: 999px; }
  h1 { margin-top: 22px; font-size: 168px; line-height: 1; font-weight: 900; letter-spacing: -4px;
       background: linear-gradient(180deg, #fff 30%, #ffb3ad 100%); -webkit-background-clip: text; color: transparent; }
  h1 small { font-size: 56px; letter-spacing: 0; font-weight: 800; color: #ff5a4f; -webkit-text-fill-color: #ff5a4f; margin-left: 12px; }
  .sub { margin-top: 14px; font-size: 44px; font-weight: 800; }
  .sub b { color: #ffd23f; }

  .alert { margin-top: 34px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .16); border-left: 8px solid #ff3b30; border-radius: 16px; padding: 22px 26px; font-size: 27px; line-height: 1.5; font-weight: 700; }
  .alert .hd { color: #ff6b61; }
  .alert .sk { color: #ffd23f; }

  .chips { position: absolute; left: 56px; bottom: 48px; display: flex; gap: 12px; }
  .chip { font-size: 26px; font-weight: 800; padding: 10px 20px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22); }
  .foot { position: absolute; right: 56px; bottom: 54px; font-size: 24px; font-weight: 700; color: rgba(255, 255, 255, .6); letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="ring r4"></div><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>

  <!-- 사이렌 -->
  <svg class="siren" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#e5251b"/>
      </linearGradient>
    </defs>
    <g stroke="#ffd23f" stroke-width="10" stroke-linecap="round">
      <line x1="150" y1="14" x2="150" y2="46"/>
      <line x1="46" y1="52" x2="68" y2="76"/><line x1="254" y1="52" x2="232" y2="76"/>
      <line x1="10" y1="132" x2="40" y2="138"/><line x1="290" y1="132" x2="260" y2="138"/>
    </g>
    <path d="M62 214 C62 130 98 84 150 84 C202 84 238 130 238 214 Z" fill="url(#dome)"/>
    <path d="M92 196 C94 150 112 118 142 104" stroke="#fff" stroke-opacity=".6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="44" y="214" width="212" height="34" rx="10" fill="#2b2f45"/>
    <rect x="30" y="248" width="240" height="30" rx="10" fill="#3a3f5c"/>
    <text x="150" y="196" text-anchor="middle" font-size="96" font-weight="900" fill="#fff" font-family="Apple SD Gothic Neo, sans-serif">!!</text>
  </svg>

  <div class="copy">
    <span class="kicker">MCP FOR VOOY · 호들갑 AI</span>
    <h1>야바이<small>YABAI</small></h1>
    <p class="sub">물어보기 전에, <b>먼저 호들갑.</b></p>
    <div class="alert">
      <span class="hd">🚨 비상 비상!! 과잉반응 경보 발령!!</span><br>
      <span class="sk">☠️ 태풍 '참피' 북상!!</span> 오늘 잘못하면<br>목숨이 위태로울 수 있어요!! 장난 아니에요!!
    </div>
  </div>

  <div class="chips">
    <span class="chip">🌦️ 3일 날씨</span>
    <span class="chip">📰 오늘 뉴스</span>
    <span class="chip">🔮 띠별 운세</span>
    <span class="chip">📍 대피소</span>
  </div>
  <div class="foot">설마가 사람 잡아요!!</div>
</body>
</html>
